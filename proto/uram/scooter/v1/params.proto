syntax = "proto3";
package uram.scooter.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "uram/x/scooter/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "uram/x/scooter/Params";
  option (gogoproto.equal) = true;

  string admin = 1;
}
