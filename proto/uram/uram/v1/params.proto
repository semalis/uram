syntax = "proto3";
package uram.uram.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/semalis/uram/x/uram/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "uram/x/uram/Params";
  option (gogoproto.equal) = true;
}
