syntax = "proto3";
package uram.scooter;

option go_package = "github.com/semalis/uram/x/scooter/types";

message MsgRegisterScooter {
  string creator = 1;
  string scooter_id = 2;
  string model = 3;
  string location = 4;
}

message MsgRegisterScooterResponse {}

service Msg {
  rpc RegisterScooter(MsgRegisterScooter) returns (MsgRegisterScooterResponse);
}
